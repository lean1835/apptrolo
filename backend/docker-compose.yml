version: '3.8'

services:
  apptrololo-be:
    container_name: apptrololo-be
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8080}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/apptrololo}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - apptrololo-shared-network

networks:
  apptrololo-shared-network:
    external: true
    name: apptrololo-shared-network
